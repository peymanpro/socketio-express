name: One-time qs advisory remediation

on:
  push:
    branches:
      - 'remediate/socketio-audit-20261010'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: remediate/socketio-audit-20261010
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate locked dependencies with patched qs override
        run: npm install --no-fund
      - name: Apply compatible audit fixes
        run: npm audit fix --no-fund || echo "Any remaining advisory is recorded for manual review."
      - name: Verify reproducible installation
        run: npm ci --no-audit --no-fund
      - name: Syntax validation
        run: npm run check
      - name: Unit and live transport tests
        run: npm test
      - name: Report dependency audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
          console.log("NPM_AUDIT_SUMMARY=" + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log("NPM_AUDIT_PACKAGE=" + JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable }));
          }
          NODE
      - name: Commit lockfile and remove temporary workflow
        env:
          BRANCH_NAME: remediate/socketio-audit-20261010
        run: |
          rm -f .github/workflows/remediate-qs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "security: update qs to patched release"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          